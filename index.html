  <script>
    (() => {
      let dark;
      try {
        // Dark mode is enabled by default
        dark = localStorage.getItem('dark-mode') !== 'false';
      } catch {
        dark = true;
      }
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.style.backgroundColor = dark ? '#020617' : '#e2e8f0';
    })();
  </script>
